name: Keep Render Server Alive

on:
  schedule:
    # Run every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    
    steps:
      - name: Ping Render Backend
        run: |
          echo "Pinging Render backend to keep it alive..."
          echo "URL: https://finest-cruise-moments-backend.onrender.com/health"
          
          # Make the request and capture both response code and body
          response=$(curl -s -w "\n%{http_code}" https://finest-cruise-moments-backend.onrender.com/health)
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | head -n-1)
          
          echo "Response code: $http_code"
          echo "Response body: $body"
          
          if [ "$http_code" -eq 200 ]; then
            echo "✅ Server is alive and responding!"
          else
            echo "⚠️  Server returned status code: $http_code"
            exit 1
          fi
          
      - name: Log Timestamp
        run: echo "Keep-alive ping completed at $(date)"
