services:
  - type: web
    name: finest-cruise-moments-api
    runtime: node
    region: frankfurt          # closest to EU users; change to oregon/ohio if preferred
    plan: free

    buildCommand: npm run build
    startCommand: npm run start:prod

    envVars:
      - key: NODE_ENV
        value: production

      # ── Paste your real values in Render dashboard → Environment ──
      - key: DATABASE_URL
        sync: false            # set manually in Render dashboard

      - key: JWT_SECRET
        sync: false

      - key: CORS_ORIGIN
        sync: false            # set to your Netlify URL e.g. https://finest-cruise.netlify.app

      - key: FRONTEND_URL
        sync: false            # ⚠ YOUR NETLIFY URL — used in email links (verify, reset password)
                               # e.g. https://finest-cruise-moments-frontend.netlify.app

      - key: APP_URL
        sync: false            # ⚠ SET THIS TO YOUR NETLIFY FRONTEND URL
                               # e.g. https://finest-cruise-moments-frontend.netlify.app
                               # This is used in email links (verify email, reset password)

      - key: BASE_URL
        sync: false            # your Render backend URL e.g. https://finest-cruise-moments-backend.onrender.com
                               # Used for file upload URL construction (images)

      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: MAIL_SECURE
        sync: false
      - key: MAIL_USER
        sync: false
      - key: MAIL_PASS
        sync: false
      - key: RESEND_API_KEY
        sync: false            # ⚠ Get from resend.com — required for email on Render (SMTP is blocked)

      - key: MAIL_FROM
        sync: false            # sender address — must match your Resend verified domain
                               # for testing without a domain use: onboarding@resend.dev
